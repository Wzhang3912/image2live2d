name: Self-hosted app
on:
  pull_request:
  push:
    branches: [main]
jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[app]'
      - run: docker compose up --build --wait --wait-timeout 180 app
      - run: python scripts/smoke_self_hosted.py
      - if: always()
        run: docker compose logs && docker compose down
